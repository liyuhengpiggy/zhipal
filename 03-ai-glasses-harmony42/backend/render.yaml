services:
  - type: web
    name: ai-glasses-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AI_MODE
        value: mock
      # B Agent 视觉识别接 DeepSeek（OpenAI 兼容）。VISION_API_KEY 与
      # VISION_API_TOKEN 是密钥，不能写在 Blueprint 里，需在 Render
      # 控制台 Environment 手动填，或同步 Blueprint 后覆盖。
      - key: VISION_MODE
        value: openai_compatible
      - key: VISION_BASE_URL
        value: https://api.deepseek.com/v1
      - key: VISION_MODEL
        value: deepseek-chat
      - key: VISION_API_KEY
        value: ""
      - key: VISION_API_TOKEN
        value: ""
      - key: CORS_ALLOW_ORIGINS
        value: ""
